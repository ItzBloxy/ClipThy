name: Release

# Push a tag such as v1.0.0 to build, test and publish a GitHub Release.
# The release notes come from docs/releases/<tag>.md, and the tag must match <Version> in ClipThy.csproj.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        run: dotnet test -c Release --filter "Category!=Hardware&Category!=Integration"

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v', '')

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }
          $assets = @(Get-ChildItem dist -File | ForEach-Object FullName)
          gh release create $tag @assets --title "ClipThy $tag" --notes-file $notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
