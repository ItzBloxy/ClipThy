<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="ClipThy: instant replay for the Windows desktop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11131A"/>
      <stop offset="1" stop-color="#1D202B"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3240"/>
      <stop offset="1" stop-color="#191B23"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EF4444" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>

  <!-- Logo -->
  <circle cx="210" cy="200" r="190" fill="url(#glow)"/>
  <g transform="translate(90 80) scale(0.46875)">
    <rect width="512" height="512" rx="113" fill="url(#tile)"/>
    <path d="M331 126.1 A150 150 0 1 1 181 126.1" fill="none" stroke="#ECEEF3" stroke-width="38.4"/>
    <polygon points="279.1,96.1 364.6,87.8 314.7,174.4" fill="#ECEEF3"/>
    <circle cx="256" cy="256" r="87" fill="#EF4444"/>
    <circle cx="234.2" cy="229.9" r="47.9" fill="#FFFFFF" fill-opacity="0.16"/>
  </g>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="400" y="150" font-size="92" font-weight="700" fill="#F4F5F8" letter-spacing="-1">ClipThy</text>
    <text x="403" y="200" font-size="31" fill="#C9CCD6">Instant replay for the Windows desktop</text>
    <text x="403" y="240" font-size="21" fill="#8C91A2">Press a hotkey and the last 30 seconds become an MP4.</text>
  </g>

  <!-- Rolling buffer: older frames fade out of memory, the newest seconds become the clip -->
  <g>
    <rect x="403" y="286" width="18" height="30" rx="4" fill="#4A5063" fill-opacity="0.08"/>
